<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>見積書 | WASSA WASSA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ocean:   #1a6b7a;
    --ocean2:  #2a8a9b;
    --sand:    #f7f3ee;
    --sand2:   #ede8e1;
    --text:    #2c2c2c;
    --text2:   #6b6b6b;
    --text3:   #999;
    --white:   #ffffff;
    --border:  #d8d0c8;
    --coral:   #e07a8a;
    --bg:      #f5f5f5;
    --radius:  8px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
    background: var(--sand);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── サイトヘッダー ── */
  .site-header {
    background: var(--ocean);
    color: var(--white);
    text-align: center;
    padding: 20px 20px 16px;
  }
  .site-header .tagline {
    font-size: 10px;
    opacity: .85;
    letter-spacing: .18em;
    margin-bottom: 5px;
  }
  .site-header .logo {
    font-family: 'Shippori Mincho', serif;
    font-size: 20px;
    letter-spacing: .25em;
  }

  /* ── コンテナ ── */
  .container {
    max-width: 680px;
    margin: 28px auto 60px;
    padding: 0 16px;
  }

  .card {
    background: var(--white);
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,.07);
    overflow: hidden;
    padding: 32px 32px 28px;
  }

  /* ── 見積書本体（管理画面と同じクラス）── */
  .quote-to { margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .quote-to .name-line { font-size: 20px; font-weight: 500; border-bottom: 2px solid var(--text); display: inline-block; min-width: 200px; padding-bottom: 2px; margin-right: 4px; }
  .quote-to .sama { font-size: 14px; color: var(--text2); }
  .quote-tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 14px; }
  .quote-tbl th { background: var(--ocean); color: var(--white); padding: 7px 10px; text-align: left; font-weight: 500; font-size: 11px; border: 1px solid var(--ocean); }
  .quote-tbl th:nth-child(3), .quote-tbl th:nth-child(4), .quote-tbl th:last-child { text-align: right; }
  .quote-tbl td { padding: 6px 10px; border: 1px solid var(--border); color: var(--text2); }
  .quote-tbl td:nth-child(3), .quote-tbl td:nth-child(4), .quote-tbl td:last-child { text-align: right; color: var(--text); }
  .quote-tbl tr.night-row td { background: var(--bg); font-weight: 600; color: var(--text); font-size: 11px; }
  .quote-tbl tr.sub-row td { padding: 4px 10px 4px 24px; font-size: 11px; }
  .quote-total { display: flex; justify-content: space-between; align-items: center; background: var(--ocean); color: var(--white); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; }
  .quote-total .label { font-size: 13px; font-weight: 500; }
  .quote-total .amount { font-size: 26px; font-weight: 500; font-family: 'Cormorant Garamond', serif; letter-spacing: .04em; }
  .quote-note { font-size: 11px; color: var(--text2); line-height: 1.7; margin-bottom: 14px; }
  .quote-note p { margin-bottom: 3px; }
  .quote-footer { text-align: center; font-size: 10px; color: var(--text3); padding-top: 12px; border-top: 1px solid var(--border); line-height: 1.8; }

  /* ── 期限切れバッジ ── */
  .expired-badge {
    display: inline-block;
    background: #e74c3c;
    color: #fff;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* ── ローディング / エラー ── */
  .loading, .error-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
    font-size: 14px;
    line-height: 2;
  }
  .error-msg { color: #c0392b; }

  /* ── 印刷ボタン ── */
  .btn-print {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 13px;
    background: var(--sand);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    text-align: center;
    font-family: inherit;
  }
  .btn-print:hover { background: var(--sand2); }

  @media print {
    @page { size: A4 portrait; margin: 12mm 10mm; }
    .site-header, .btn-print { display: none; }
    body { background: #fff; }
    .card { box-shadow: none; border-radius: 0; margin: 0; padding: 16px; }
    .container { margin: 0; padding: 0; }
    :root { --ocean: #155f6d; --ocean2: #1a7a8b; }
    .quote-total { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .quote-tbl th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media (max-width: 480px) {
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>

<header class="site-header" id="site-header">
  <div class="tagline">海と星空の小さな宿</div>
  <div class="logo">WASSA WASSA</div>
</header>

<div class="container">
  <div class="card" id="main-card">
    <div class="loading" id="loading">見積書を読み込んでいます…</div>
  </div>
</div>

<script>
var SB_URL = 'https://mtsdhheqddrckksiqlim.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10c2RoaGVxZGRyY2trc2lxbGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1OTc5NDgsImV4cCI6MjA4ODE3Mzk0OH0.c18ExSxNHBOani7CN4QAqaerhvpr5ZCYA0GGkUg0mlc';

var LOGO_URL = './logo.png';
var STAMP_URL = './stamp.png';

function fmtDate(s) {
  if (!s) return '';
  var m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[1]+'年'+parseInt(m[2])+'月'+parseInt(m[3])+'日' : s;
}
function fmtPrice(n) {
  return '¥' + parseInt(n||0).toLocaleString();
}
function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 宿泊明細を表示用に統合（素泊まり室料＋朝食 → 「大人宿泊料金(朝食付)」等）。
// wassa-guestbook.html の同名関数と同一ロジック（JSはファイル間で共有不可のため複製）。
function unifyLodgingRows(billingRows, roomType, mode){
  var rows = Array.isArray(billingRows) ? billingRows
           : (billingRows && Array.isArray(billingRows.rows) ? billingRows.rows : []);
  var isDlx = /デラックス|dlx|DX/i.test(roomType||'');
  var lodging=[], bf=[], dinner=[], other=[];
  rows.forEach(function(row){
    if(row.is_ref) return;
    var cat=row.cat||'';
    if(/夕食|ディナー|dinner/i.test(cat)) dinner.push(row);
    else if(/朝食|breakfast/i.test(cat)) bf.push(row);
    else if(cat==='宿泊料金'||cat==='night'||cat==='宿泊'||/宿泊|素泊まり|室料/.test(row.item||'')) lodging.push(row);
    else other.push(row);
  });
  function coarseTier(item){
    if(/大人|adult/i.test(item)) return 'adult';
    if(/小学生|子供|こども|child/i.test(item)) return 'child';
    if(/幼児|乳幼児|infant/i.test(item)) return 'infant';
    return 'adult';
  }
  // 朝食は宿泊の翌朝提供で日付が1日ズレる（直予約）ことも同日付（OTA）のこともある。
  // 日付一致でなく大区分ごとに日付順キューを作り、宿泊行の泊数ぶんを順番に対応付ける。余った朝食は独立行で必ず出す。
  // 朝食は「大人価格プール」と「子供価格プール」に分け1人ぶんずつ保持。直予約の朝食（こども）qtyは小学生＋幼児混在のため人数ぶんを個別配分。
  var bfPoolAdult=[], bfPoolChild=[];
  bf.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');})
    .forEach(function(b){
      var _pool=(coarseTier(b.item||'')==='adult')?bfPoolAdult:bfPoolChild;
      var _q=parseInt(b.qty)||1, _u=parseFloat(b.price)||0, _d=parseFloat(b.discount)||0;
      var _pd=_q>0?_d/_q:0;
      for(var _i=0;_i<_q;_i++) _pool.push({price:_u, amt:_u-_pd, date:b.date||'', item:(b.item||'朝食')});
    });
  var bfPtrA=0, bfPtrC=0;
  var _itemHasBf=function(item){ return /朝食付|朝夕食付/.test(item); };
  var planHasBf = bf.length>0 || lodging.some(function(row){return _itemHasBf(row.item||'');});
  function infSub(item){
    var noMeal=/食事なし|食事無|食なし|食無|布団のみ|食事・寝具なし|食事布団なし/.test(item);
    var futon;
    if(/布団なし|布団無|寝具なし|寝具無/.test(item)) futon=false;
    else if(/布団あり|布団有|寝具あり|寝具有|布団付|布団のみ|食事・布団付/.test(item)) futon=true;
    else futon=true;
    return {futon:futon, meal:!noMeal};
  }
  var lodgingLines=[];
  lodging.forEach(function(row){
    var item=row.item||'', date=row.date||'', qty=parseInt(row.qty)||1;
    var roomUnit=parseFloat(row.price)||0;
    var roomAmt=roomUnit*qty-(parseFloat(row.discount)||0);
    var tier=coarseTier(item);
    var folded=_itemHasBf(item);
    var sub=(tier==='infant')?infSub(item):null;
    var wantsBf = !folded && (tier!=='infant' || (sub && sub.meal));
    var bfU=0, bfA=0, gotBf=0;
    if(wantsBf){
      if(tier==='adult'){
        for(var _bk=0;_bk<qty && bfPtrA<bfPoolAdult.length;_bk++){ bfU=bfPoolAdult[bfPtrA].price; bfA+=bfPoolAdult[bfPtrA].amt; bfPtrA++; gotBf++; }
      } else {
        for(var _bk2=0;_bk2<qty && bfPtrC<bfPoolChild.length;_bk2++){ bfU=bfPoolChild[bfPtrC].price; bfA+=bfPoolChild[bfPtrC].amt; bfPtrC++; gotBf++; }
      }
    }
    var hasBf = gotBf>0;
    var dispUnit=roomUnit, lineAmt=roomAmt;
    var label;
    if(tier==='adult'||tier==='child'){
      var meal = folded || hasBf;
      if(!folded && hasBf){ dispUnit=roomUnit+bfU; lineAmt=roomAmt+bfA; }
      var head = tier==='adult' ? '大人宿泊料金' : '小学生宿泊料金';
      label = head + (meal ? '(朝食付)' : '(素泊まり)');
    } else {
      var explicitBf = /食事有|食事あり|食事付|朝食有|朝食あり/.test(item);
      var meal2 = sub.meal && (folded || hasBf || explicitBf);
      if(sub.meal && !folded && hasBf){ dispUnit=roomUnit+bfU; lineAmt=roomAmt+bfA; }
      var futonYN = sub.futon ? '布団あり' : '布団なし';
      var futonTsuki = sub.futon ? '布団付き' : '布団なし';
      if(!planHasBf)      label='幼児宿泊料金(素泊まり・'+futonYN+')';
      else if(meal2)      label='幼児宿泊料金(朝食付・'+futonTsuki+')';
      else                label='幼児宿泊料金(朝食なし・'+futonTsuki+')';
    }
    lodgingLines.push({date:date,label:label,unit:dispUnit,qty:qty,amt:lineAmt,kind:'lodging',tier:tier});
  });
  var bfLeftover=[];
  function _flushBf(pool, ptr){
    for(var i=ptr;i<pool.length;i++){
      var b=pool[i];
      bfLeftover.push({date:b.date||'',label:(b.item||'朝食'),unit:b.price,qty:1,amt:b.amt,kind:'lodging',tier:'other'});
    }
  }
  _flushBf(bfPoolAdult, bfPtrA);
  _flushBf(bfPoolChild, bfPtrC);
  var out=[];
  if(mode==='slip' && isDlx){
    var aLines=lodgingLines.filter(function(l){return l.tier==='adult';});
    if(aLines.length){
      var nn={}; var aQty=aLines[0].qty; var aAmt=0;
      aLines.forEach(function(l){ if(l.date)nn[l.date]=1; aAmt+=l.amt; });
      var nN=Object.keys(nn).length||aLines.length;
      out.push({date:'',label:nN+'泊'+(nN+1)+'日プログラム（大人'+aQty+'名様）',unit:0,qty:0,amt:aAmt,kind:'lodging',tier:'adult'});
    }
    lodgingLines.filter(function(l){return l.tier!=='adult';}).forEach(function(l){out.push(l);});
  } else {
    lodgingLines.forEach(function(l){out.push(l);});
  }
  bfLeftover.forEach(function(l){out.push(l);});
  dinner.forEach(function(row){
    var qty=parseInt(row.qty)||1, unit=parseFloat(row.price)||0;
    var it=row.item||'夕食';
    if(!/夕食|ディナー/.test(it)) it='夕食（'+it+'）';
    out.push({date:row.date||'',label:it,unit:unit,qty:qty,amt:unit*qty-(parseFloat(row.discount)||0),kind:'dinner',tier:'meal'});
  });
  other.forEach(function(row){
    var qty=parseInt(row.qty)||1, unit=parseFloat(row.price)||0;
    out.push({date:row.date||'',label:(row.item||row.cat||''),unit:unit,qty:qty,amt:unit*qty-(parseFloat(row.discount)||0),kind:'other',tier:'other'});
  });
  return out;
}

function getToken() {
  var p = new URLSearchParams(location.search);
  return p.get('token') || '';
}

async function loadQuote() {
  var token = getToken();
  if (!token) { showError('URLが正しくありません。'); return; }

  var [res, cpRes] = await Promise.all([
    fetch(SB_URL + '/rest/v1/quotes?token=eq.' + encodeURIComponent(token) + '&select=*', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    }),
    fetch(SB_URL + '/rest/v1/price_common?id=eq.1&select=cancel_policy', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    })
  ]);
  if (!res.ok) { showError('データを取得できませんでした。'); return; }
  var rows = await res.json();
  if (!rows || rows.length === 0) { showError('見積書が見つかりません。\nURLをご確認ください。'); return; }
  var cpData = cpRes.ok ? await cpRes.json() : [];
  var cancelPolicy = (cpData && cpData[0] && cpData[0].cancel_policy) || '';
  render(rows[0], cancelPolicy);
}

function render(q, cancelPolicy) {
  var card = document.getElementById('main-card');

  // ドキュメント種別
  var isConfirmation = q.doc_type === 'confirmation';
  var docTitle = isConfirmation ? '予約確認書' : '見　積　書';
  var totalLabel = isConfirmation ? 'ご宿泊料金合計（税込）' : 'お見積り合計金額（税込）';

  // 有効期限チェック
  var isExpired = false;
  if (q.valid_until) {
    var exp = new Date(q.valid_until); exp.setHours(23,59,59);
    isExpired = new Date() > exp;
  }

  var today = q.created_at ? q.created_at.slice(0,10) : new Date().toISOString().slice(0,10);
  var planName = q.plan_name || (q.billing && q.billing.plan_name) || '';

  // 明細行生成（billing は配列または {rows:[...]} 形式に対応）
  var billingRows = q.billing;
  if (billingRows && !Array.isArray(billingRows) && Array.isArray(billingRows.rows)) {
    billingRows = billingRows.rows;
  }
  var rows = '';
  if (Array.isArray(billingRows) && billingRows.length > 0) {
    var _uni = unifyLodgingRows(billingRows, q.room_type || q.room || '', 'quote');
    // 日付ごとにまとめ、日内は 大人宿泊→大人夕食→幼児宿泊→幼児夕食 の順（安定・日付なしは末尾）
    var _tierRank=function(l){
      if(l.tier==='adult')return 0; if(l.tier==='child')return 1; if(l.tier==='infant')return 2;
      var lab=l.label||''; // 夕食等はラベルから判定
      if(/幼児|乳児/.test(lab))return 2; if(/小学生|子供|こども/.test(lab))return 1;
      if(l.kind==='dinner')return 0; return 3; // 大人夕食は0、その他は末尾
    };
    var _kindRank=function(l){return l.kind==='lodging'?0:(l.kind==='dinner'?1:2);};
    _uni = _uni.map(function(l,i){return {l:l,i:i};}).sort(function(a,b){
      var da=a.l.date||'\uffff', db=b.l.date||'\uffff';
      if(da<db)return -1; if(da>db)return 1;
      var ta=_tierRank(a.l), tb=_tierRank(b.l); if(ta!==tb)return ta-tb;
      var ka=_kindRank(a.l), kb=_kindRank(b.l); if(ka!==kb)return ka-kb;
      return a.i-b.i;
    }).map(function(x){return x.l;});
    var prevDate = '';
    _uni.forEach(function(l) {
      var d = l.date || '';
      var first = (d && d !== prevDate);
      var dateCell = first ? fmtDate(d) : '';
      var trClass = first ? ' class="night-row"' : ' class="sub-row"';
      prevDate = d || prevDate;
      var unitCell = l.unit > 0 ? fmtPrice(l.unit) : '';
      var qtyCell = l.qty > 0 ? l.qty + '名' : '';
      rows += '<tr'+trClass+'><td>'+escHtml(dateCell)+'</td><td>'+escHtml(l.label)+'</td><td>'+unitCell+'</td><td>'+qtyCell+'</td><td>'+fmtPrice(l.amt)+'</td></tr>';
    });
  }

  // 部屋名フルネーム
  var roomType = q.room_type || q.room || '';
  var roomLabel = '';
  if (roomType) {
    if (roomType.indexOf('デラックス') !== -1 || roomType === 'dlx' || roomType === 'DX')
      roomLabel = 'デラックスツインルーム';
    else if (roomType.indexOf('01') !== -1 || roomType === 'S1' || roomType === 'sup01')
      roomLabel = 'スーペリアツインルーム';
    else if (roomType.indexOf('02') !== -1 || roomType === 'S2' || roomType === 'sup02')
      roomLabel = 'スーペリアツインルーム';
    else
      roomLabel = roomType;
  }
  var roomHeader = roomLabel
    ? '<div style="text-align:center;font-size:12px;font-weight:600;color:var(--ocean2);background:var(--sand);border-radius:4px;padding:4px 14px;display:inline-block;margin:0 auto 14px;letter-spacing:.05em">' + escHtml(roomLabel) + '</div><br>'
    : '';

  var expiredHtml = isExpired ? ' <span class="expired-badge">期限切れ</span>' : '';
  var validFmt = q.valid_until ? fmtDate(q.valid_until) : '';

  // キャンセルポリシー
  var cancelHtml = cancelPolicy
    ? '<div style="border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin-bottom:14px;font-size:10px;color:var(--text2);line-height:1.9">'
        + '<div style="font-weight:700;color:var(--text);margin-bottom:6px;font-size:11px">キャンセルポリシー</div>'
        + escHtml(cancelPolicy).replace(/\n/g,'<br>')
      + '</div>'
    : '';

  card.innerHTML =
    // 発行日
    '<div style="text-align:right;font-size:10px;color:var(--text2);line-height:2;margin-bottom:6px">'
      + '<div>発行：' + fmtDate(today) + '</div>'
      + (validFmt && !isConfirmation ? '<div>有効期限：' + validFmt + expiredHtml + '</div>' : '')
    + '</div>'
    // タイトル
    + '<div style="text-align:center;font-size:22px;font-weight:700;' + (isConfirmation ? '' : 'letter-spacing:.3em;') + 'font-family:\'Shippori Mincho\',serif;margin-bottom:18px">' + docTitle + '</div>'
    + (roomHeader || '')
    // お客様名 ＋ 事業所情報
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--ocean)">'
      + '<div class="quote-to" style="margin:0;padding:0;border:none;padding-top:6px">'
        + '<span class="name-line">' + escHtml(q.guest_name || '　　　　　　　　') + '</span>'
        + '<span class="sama">様</span>'
      + '</div>'
      + '<div style="text-align:right">'
        + '<div style="display:flex;align-items:flex-end;justify-content:flex-end;gap:8px;margin-bottom:6px">'
          + '<img src="' + LOGO_URL + '" style="height:40px;width:auto;mix-blend-mode:multiply">'
          + '<img src="' + STAMP_URL + '" style="width:36px;height:36px;object-fit:contain;mix-blend-mode:multiply">'
        + '</div>'
        + '<div style="font-size:10px;color:var(--text2);line-height:1.9">'
          + '<div style="font-size:10px;color:var(--ocean);letter-spacing:.1em;margin-bottom:2px">海と星空の小さな宿</div>'
          + '<div style="font-size:13px;font-weight:700;color:var(--ocean);font-family:\'Shippori Mincho\',serif;letter-spacing:.1em">WASSA WASSA</div>'
          + '<div>〒905-1307 沖縄県国頭郡大宜味村根路銘97番地</div>'
          + '<div>wassa@wassa-okinawa.com</div>'
        + '</div>'
      + '</div>'
    + '</div>'
    // プラン名（明細直上）
    + (planName ? '<div style="font-size:11px;color:var(--ocean2);font-weight:600;margin-bottom:8px;letter-spacing:.04em">' + escHtml(planName) + '</div>' : '')
    // 明細テーブル
    + '<table class="quote-tbl"><thead><tr><th>日付</th><th>内容</th><th>単価</th><th>数量</th><th>金額</th></tr></thead><tbody>' + rows + '</tbody></table>'
    // 割引
    + ((parseInt(q.discount)||0) > 0 ? '<div style="text-align:right;font-size:12px;color:var(--coral);padding:4px 16px 8px;margin-top:-8px">割引　▲' + fmtPrice(parseInt(q.discount)) + '</div>' : '')
    // 合計
    + '<div class="quote-total"><span class="label">' + totalLabel + '</span><span class="amount">' + fmtPrice((parseInt(q.discount)||0) > 0 ? Math.max(0,(parseInt(q.total_amount)||0) - parseInt(q.discount)) : q.total_amount) + '</span></div>'
    // 備考
    + (q.notes && !q.notes.startsWith('貸切 buyout-') ? '<div class="quote-note"><p>' + escHtml(q.notes).replace(/\n/g,'<br>') + '</p></div>' : '')
    // ご連絡
    + '<div class="quote-note"><p>・ご不明な点はお気軽にお問い合わせください。</p></div>'
    // キャンセルポリシー
    + cancelHtml
    // フッター
    + '<div class="quote-footer">海と星空の小さな宿 WASSA WASSA<br>ご予約・お問い合わせ：wassa@wassa-okinawa.com<br>LINE公式アカウント：@979ygbub</div>'
    // 印刷ボタン
    + (function(){
        var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
        if(isIOS){
          return '<div style="margin-top:24px;padding:14px 16px;background:var(--sand);border-radius:10px;font-size:13px;color:var(--text2);line-height:1.8;text-align:center">'
            + '📄 PDFとして保存するには<br>'
            + 'Safari下部の <strong>共有ボタン（□↑）</strong> をタップ<br>'
            + '→「<strong>プリント</strong>」→ 2本指でピンチアウト → 共有 → PDF保存'
            + '</div>';
        } else {
          return '<button class="btn-print" onclick="window.print()">🖨️ 印刷・PDFとして保存</button>';
        }
      })();
}

function showError(msg) {
  document.getElementById('main-card').innerHTML = '<div class="error-msg">' + msg.replace(/\n/g,'<br>') + '<br><br><a href="mailto:wassa@wassa-okinawa.com" style="color:var(--ocean)">wassa@wassa-okinawa.com</a></div>';
}

loadQuote();
</script>
